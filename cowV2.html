<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculationsorwhatever [COW]</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }
        .cow-logo { width: 64px; height: 64px; margin-bottom: 8px; }
        h1 { font-size: 1.8rem; color: #38bdf8; text-align: center; }
        p.subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 8px; text-align: center; }
        
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem; }
        .score-val { font-weight: bold; color: #4ade80; font-size: 1.05rem; }
        
        select {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            margin-top: 4px;
        }

        .progress-box {
            width: 100%;
            background: #0f172a;
            border-radius: 8px;
            height: 12px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
            border: 1px solid #334155;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #f43f5e);
            transition: width 0.1s linear;
        }

        .history-list { list-style: none; max-height: 120px; overflow-y: auto; }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item span.scores { color: #f8fafc; font-weight: 500; }

        .btn-group { display: flex; gap: 10px; width: 100%; max-width: 400px; }
        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:disabled { background: #475569; opacity: 0.6; }
        #status { margin-top: 8px; margin-bottom: 8px; font-weight: 600; color: #facc15; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <svg class="cow-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 20 20 L 35 35 L 20 40 Z" fill="#94a3b8"/>
            <path d="M 80 20 L 65 35 L 80 40 Z" fill="#94a3b8"/>
            <rect x="25" y="30" width="50" height="45" rx="15" fill="#f8fafc"/>
            <circle cx="38" cy="45" r="5" fill="#0f172a"/>
            <circle cx="62" cy="45" r="5" fill="#0f172a"/>
            <rect x="30" y="55" width="40" height="22" rx="10" fill="#f472b6"/>
            <circle cx="42" cy="66" r="3" fill="#831843"/>
            <circle cx="58" cy="66" r="3" fill="#831843"/>
        </svg>
        <h1>calculationsorwhatever</h1>
        <p class="subtitle">[COW Benchmark Engine]</p>
    </div>

    <!-- Mode Selector -->
    <div class="card">
        <div class="card-title">Workload Preset</div>
        <select id="workload-select">
            <option value="light">Light (Basic Arithmetic)</option>
            <option value="standard">Standard (Trigonometry)</option>
            <option value="heavy">Heavy (Logarithms & Power Math)</option>
            <option value="max">Max / Extreme (Bitwise & Primes)</option>
            <option value="dynamic" selected>⚡ Dynamic (Unpredictable Chaos Mode)</option>
        </select>
    </div>

    <!-- System & SoC Info -->
    <div class="card">
        <div class="card-title">System & SoC Info</div>
        <div class="info-row">
            <span>Logical CPU Cores:</span>
            <span id="core-count" style="color: #f8fafc; font-weight: bold;">--</span>
        </div>
        <div class="info-row">
            <span>GPU / SoC Chipset:</span>
            <span id="gpu-info" style="color: #f8fafc; font-weight: bold; text-align: right; max-width: 60%;">Detecting...</span>
        </div>
    </div>

    <!-- Benchmark Results -->
    <div class="card">
        <div class="card-title">Test Results</div>
        <div class="info-row">
            <span>Single-Core Score:</span>
            <span id="single-score" class="score-val">0 C/S</span>
        </div>
        <div class="info-row">
            <span>Multi-Core Score:</span>
            <span id="multi-score" class="score-val">0 C/S</span>
        </div>
        
        <div id="progress-box" class="progress-box">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="run-btn" onclick="startBenchmark()">RUN BENCHMARK</button>
    </div>

    <div id="status">Ready to test.</div>

    <!-- Score History -->
    <div class="card">
        <div class="card-title">Score History</div>
        <ul id="history-list" class="history-list">
            <li class="history-item">No previous tests saved.</li>
        </ul>
    </div>

    <script>
        const logicalCores = navigator.hardwareConcurrency || 4;
        document.getElementById('core-count').textContent = logicalCores;

        function detectSoC() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        
                        const socDatabase = [
                            { gpu: /840/i, soc: "Snapdragon 8 Elite Gen 5" },
                            { gpu: /830/i, soc: "Snapdragon 8 Elite" },
                            { gpu: /750/i, soc: "Snapdragon 8 Gen 3" },
                            { gpu: /740/i, soc: "Snapdragon 8 Gen 2" },
                            { gpu: /730/i, soc: "Snapdragon 8 Gen 1 / 8+ Gen 1" },
                            { gpu: /660/i, soc: "Snapdragon 888 / 888+" },
                            { gpu: /650/i, soc: "Snapdragon 865 / 870" },
                            { gpu: /710/i, soc: "Snapdragon 7s Gen 2 / 6 Gen 1" },
                            { gpu: /720/i, soc: "Snapdragon 7+ Gen 3" },
                            { gpu: /G925/i, soc: "MediaTek Dimensity 9400" },
                            { gpu: /G720/i, soc: "MediaTek Dimensity 9300 / 9300+" },
                            { gpu: /G715/i, soc: "MediaTek Dimensity 9200 / 8300" },
                            { gpu: /G610/i, soc: "MediaTek Dimensity 8100 / 8200" },
                            { gpu: /G57/i, soc: "MediaTek Dimensity 700 / 6080" },
                            { gpu: /Xclipse 940/i, soc: "Samsung Exynos 2400" },
                            { gpu: /Xclipse 920/i, soc: "Samsung Exynos 2200" },
                            { gpu: /G78/i, soc: "Samsung Exynos 2100 / Dimensity 1200" },
                            { gpu: /Adreno/i, soc: "Qualcomm Snapdragon SoC" },
                            { gpu: /Mali/i, soc: "MediaTek / Exynos SoC" },
                            { gpu: /Apple/i, soc: "Apple A-Series Bionic" }
                        ];

                        let matchedSoC = null;
                        for (const item of socDatabase) {
                            if (item.gpu.test(renderer)) {
                                matchedSoC = item.soc;
                                break;
                            }
                        }

                        const cleanRenderer = renderer.replace(/Angle \((.*)\)/i, '$1').replace(/Direct3D11 vs_5_0 ps_5_0/i, '').trim();
                        if (matchedSoC) {
                            document.getElementById('gpu-info').textContent = `${matchedSoC} (${cleanRenderer})`;
                        } else {
                            document.getElementById('gpu-info').textContent = cleanRenderer;
                        }
                        return;
                    }
                }
                document.getElementById('gpu-info').textContent = 'Generic Mobile GPU';
            } catch (e) {
                document.getElementById('gpu-info').textContent = 'Unknown SoC';
            }
        }
        detectSoC();

        const workerCode = `
            self.onmessage = function(e) {
                const duration = e.data.duration;
                const mode = e.data.mode;
                const startTime = performance.now();
                let operations = 0;
                let state = operations + 1;

                if (mode === 'dynamic') {
                    // Unpredictable / Chaotic Multi-Math Engine
                    while (performance.now() - startTime < duration) {
                        state = (state * 1664525 + 1013904223) % 4294967296;
                        const branch = state % 6;

                        switch (branch) {
                            case 0:
                                Math.hypot(Math.sin(operations), Math.cos(operations));
                                break;
                            case 1:
                                (operations << 5) ^ (operations >> 3) | (operations * 31);
                                break;
                            case 2:
                                Math.log(operations + 1) * Math.exp((operations % 5) * 0.1);
                                break;
                            case 3:
                                Math.atan2(operations, operations + 1) + Math.tan(operations % 1.5);
                                break;
                            case 4:
                                Math.cbrt(operations * 123.456) / (Math.sqrt(operations + 1) + 1);
                                break;
                            case 5:
                                Math.pow((operations % 100) * 0.1, 2.5) + Math.abs(~operations);
                                break;
                        }
                        operations++;
                    }
                } else if (mode === 'light') {
                    while (performance.now() - startTime < duration) {
                        let x = operations + 1.5;
                        x = x * 2.5;
                        operations++;
                    }
                } else if (mode === 'heavy') {
                    while (performance.now() - startTime < duration) {
                        Math.log(operations + 1) * Math.atan(operations) + Math.exp(operations % 5);
                        operations++;
                    }
                } else if (mode === 'max') {
                    while (performance.now() - startTime < duration) {
                        ((operations << 3) ^ (operations >> 2)) | Math.hypot(operations, operations % 10);
                        operations++;
                    }
                } else {
                    while (performance.now() - startTime < duration) {
                        Math.sqrt(operations) * Math.sin(operations) + Math.cos(operations);
                        operations++;
                    }
                }

                self.postMessage(operations);
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        function updateProgress(percent) {
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        async function animateProgress(durationMs, startPercent, endPercent) {
            const startTime = performance.now();
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    const elapsed = performance.now() - startTime;
                    const p = Math.min(1, elapsed / durationMs);
                    const currentPercent = startPercent + (p * (endPercent - startPercent));
                    updateProgress(currentPercent);
                    if (p >= 1) {
                        clearInterval(interval);
                        resolve();
                    }
                }, 30);
            });
        }

        async function runCpuWarmup(mode, durationMs = 1500) {
            const workerPromises = [];
            for (let i = 0; i < logicalCores; i++) {
                const p = new Promise((resolve) => {
                    const worker = new Worker(workerUrl);
                    worker.onmessage = (e) => {
                        worker.terminate();
                        resolve();
                    };
                    worker.postMessage({ duration: durationMs, mode: mode });
                });
                workerPromises.push(p);
            }
            await Promise.all(workerPromises);
        }

        async function runSingleCoreTest(mode, durationMs = 3000) {
            return new Promise((resolve) => {
                const worker = new Worker(workerUrl);
                worker.onmessage = (e) => {
                    worker.terminate();
                    const opsPerSecond = Math.round((e.data / durationMs) * 1000);
                    resolve(opsPerSecond);
                };
                worker.postMessage({ duration: durationMs, mode: mode });
            });
        }

        async function runMultiCoreTest(mode, durationMs = 3000) {
            const workerPromises = [];
            for (let i = 0; i < logicalCores; i++) {
                const p = new Promise((resolve) => {
                    const worker = new Worker(workerUrl);
                    worker.onmessage = (e) => {
                        worker.terminate();
                        resolve(e.data);
                    };
                    worker.postMessage({ duration: durationMs, mode: mode });
                });
                workerPromises.push(p);
            }

            const results = await Promise.all(workerPromises);
            const totalOps = results.reduce((acc, val) => acc + val, 0);
            return Math.round((totalOps / durationMs) * 1000);
        }

        async function startBenchmark() {
            const btn = document.getElementById('run-btn');
            const status = document.getElementById('status');
            const progressBox = document.getElementById('progress-box');
            const mode = document.getElementById('workload-select').value;
            
            btn.disabled = true;
            progressBox.style.display = 'block';
            updateProgress(0);

            document.getElementById('single-score').textContent = '...';
            document.getElementById('multi-score').textContent = '...';

            const warmupDuration = 1500;
            const testDuration = 3000;

            // Warmup Phase
            status.textContent = 'Warming up CPU (Ramping Frequencies)...';
            const warmupPromise = runCpuWarmup(mode, warmupDuration);
            await animateProgress(warmupDuration, 0, 20);
            await warmupPromise;

            // Single Core
            status.textContent = `Testing Single-Core (${mode.toUpperCase()})...`;
            const singlePromise = runSingleCoreTest(mode, testDuration);
            await animateProgress(testDuration, 20, 60);
            const singleScore = await singlePromise;
            document.getElementById('single-score').textContent = singleScore.toLocaleString() + ' C/S';

            // Multi Core
            status.textContent = `Testing Multi-Core (${mode.toUpperCase()})...`;
            const multiPromise = runMultiCoreTest(mode, testDuration);
            await animateProgress(testDuration, 60, 100);
            const multiScore = await multiPromise;
            document.getElementById('multi-score').textContent = multiScore.toLocaleString() + ' C/S';

            status.textContent = 'Benchmark Complete!';
            btn.disabled = false;
            
            saveScore(mode, singleScore, multiScore);
        }

        function saveScore(mode, single, multi) {
            const history = JSON.parse(localStorage.getItem('cow_scores') || '[]');
            const newEntry = {
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                mode: mode.toUpperCase(),
                single: single.toLocaleString(),
                multi: multi.toLocaleString()
            };
            history.unshift(newEntry);
            if (history.length > 5) history.pop();
            localStorage.setItem('cow_scores', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('cow_scores') || '[]');
            const listEl = document.getElementById('history-list');
            
            if (history.length === 0) {
                listEl.innerHTML = '<li class="history-item">No previous tests saved.</li>';
                return;
            }

            listEl.innerHTML = history.map(item => `
                <li class="history-item">
                    <span>${item.date} [${item.mode}]</span>
                    <span class="scores">S: ${item.single} | M: ${item.multi} C/S</span>
                </li>
            `).join('');
        }

        renderHistory();
    </script>
</body>
</html>
